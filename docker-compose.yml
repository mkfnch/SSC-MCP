version: '3.8'

services:
  securityscorecard-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    # Bind to loopback only by default. Change to "0.0.0.0:3000:3000" (or remove
    # the host prefix entirely) only if external access is required and the host
    # is protected by a reverse-proxy or firewall that enforces TLS and auth.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - TRANSPORT_MODE=http
      - PORT=3000
      - SSC_API_BASE_URL=https://api.securityscorecard.io
      - SSC_API_KEY=${SSC_API_KEY}
      - LOG_LEVEL=info
      - NODE_ENV=production
      # ALLOWED_ORIGINS: comma-separated list of origins permitted for CORS.
      # Example: "https://app.example.com,https://other.example.com"
      # Leave unset to deny all cross-origin requests (recommended default).
      # - ALLOWED_ORIGINS=
    restart: unless-stopped
    # Drop all Linux capabilities and prevent privilege escalation
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start-period: 5s
      retries: 3
