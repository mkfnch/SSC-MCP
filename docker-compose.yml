version: '3.8'

services:
  securityscorecard-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - TRANSPORT_MODE=http
      - PORT=3000
      - SSC_API_BASE_URL=https://api.securityscorecard.io
      - SSC_API_KEY=${SSC_API_KEY}
      - LOG_LEVEL=info
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start-period: 5s
      retries: 3
